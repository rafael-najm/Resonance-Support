<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resonance — Support</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      max-width: 520px;
      width: 100%;
      text-align: center;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      background: #c8ff00;
      border-radius: 10px;
      font-weight: 800;
      font-size: 1.25rem;
      color: #000;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.75rem;
    }

    p {
      color: rgba(240,240,240,0.6);
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }

    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 2.5rem;
    }

    .support-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(240,240,240,0.4);
      margin-bottom: 0.75rem;
    }

    .email-link {
      display: inline-block;
      font-size: 1.125rem;
      font-weight: 600;
      color: #c8ff00;
      text-decoration: none;
      border-bottom: 1px solid rgba(200,255,0,0.3);
      padding-bottom: 2px;
      transition: border-color 0.15s;
    }

    .email-link:hover { border-color: #c8ff00; }

    .author {
      margin-top: 3rem;
      font-size: 0.8125rem;
      color: rgba(240,240,240,0.25);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">R</div>
    <h1>Resonance</h1>
    <p>A dark, editorial Shopify theme built for brands that want to stand out. Fully customizable from the theme editor — no code required.</p>
    <hr class="divider">
    <div class="support-label">Support</div>
    <a class="email-link" href="mailto:rafaelmnajm@gmail.com">rafaelmnajm@gmail.com</a>
    <p class="author">By Haim Templates</p>
  </div>
</body>
</html>
